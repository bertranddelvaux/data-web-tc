# This is a basic workflow to help you get started with Actions

name: latestStorms_15as

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Starting script generateCsvLosses_15as

      # Set up python
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      # Set up python packages
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
        
 # list files in mpres_data directory
      # execute python script latestStorms_15as.py
      - name: execute python script latestStorms_15as.py
        run: python scripts/latestStorms_15as.py

      - name: commit files
        run: |
          git config --global http.version HTTP/1.1
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Add all files (new, modified, deleted)
          git add -A

          # Check if there are staged changes (committed vs. staged differences)
          if ! git diff --cached --quiet; then
            git commit -m "latestStorms_15as"
          else
            echo "No changes to commit"
          fi
          
      # push changes
      - name: push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main  
